controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# [MOI] Chi phat 5 khop that len /joint_states
# Cac khop mimic cua gripper bi plugin Gazebo dat ten co duoi _mimic, khong co trong URDF.
# MoveIt nhan ten la nay trong trang thai bat dau se bao loi va khong quy hoach duoc.
# robot_state_publisher va MoveIt tu tinh 5 khop mimic tu GRIPPER_JOINT theo the mimic trong URDF.
joint_state_broadcaster:
  ros__parameters:
    joints:
      - JOINT_1
      - JOINT_2
      - JOINT_3
      - JOINT_4
      - GRIPPER_JOINT
    interfaces:
      - position
      - velocity


arm_controller:
  ros__parameters:
    joints:
      - JOINT_1
      - JOINT_2
      - JOINT_3
      - JOINT_4
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    # goal: sai lech cho phep o CUOI quy dao. Het quy dao + goal_time ma chua toi thi THAT BAI.
    # trajectory: sai lech cho phep TRONG LUC chay (vi tri thuc so voi vi tri lenh cung thoi diem).
    #   Bat truong hop cac khop lech nhau giua duong (vd khop 2 toi truoc khop 3, 4) -> controller
    #   huy quy dao, node gap dung lai TRUOC khi tay di sai duong va va vao vat.
    #   Gia tri tinh tu toc do dinh x do tre ca chuoi Pi -> STM32 -> ZDT (khoang 80 ms) x 2 lan du:
    #   J1, J4 chay toi 0.65 rad/s -> tre ~0.05 rad. J2 toi da 8 do/s (0.14 rad/s) -> tre ~0.011 rad.
    #   J3 toi da 25 do/s (0.44 rad/s) -> tre ~0.035 rad, x 2 lan du = 0.07 -> dat 0.08.
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.01
      JOINT_1: {trajectory: 0.10, goal: 0.01}   # 0.01 rad, khoang 0.6 do
      JOINT_2: {trajectory: 0.03, goal: 0.01}
      JOINT_3: {trajectory: 0.08, goal: 0.01}
      JOINT_4: {trajectory: 0.10, goal: 0.01}


# Kep KHONG dat dung sai dich: khi kep vat, ngon dung lai o mat vat chu khong toi goc lenh.
gripper_controller:
  ros__parameters:
    # Chi dieu khien GRIPPER_JOINT (goc tay quay, rad). 5 khop con lai la mimic trong URDF
    # 0.0 la dong, 0.6 la mo het
    joints:
      - GRIPPER_JOINT
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true

# Controller MoveIt dung khi chay Gazebo (simulation_robot.launch.py)
# Ten controller va danh sach khop phai trung voi final.yaml.
# File nay rieng cho Gazebo, khong thay the moveit_controllers.yaml cua demo.launch.py.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - JOINT_1
      - JOINT_2
      - JOINT_3
      - JOINT_4

  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - GRIPPER_JOINT
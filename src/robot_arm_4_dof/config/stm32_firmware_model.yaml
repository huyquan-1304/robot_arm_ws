# Mo hinh firmware STM32 cho stm32_emulator_node.py va tools/preview_real_run.py
# CHEP TU bang joint.c cua firmware. Khi ban phan cung sua joint.c thi sua theo o day,
# de mo phong luon giong robot that.
#
#  Khop | Ti so | Gioi han (do) | Toc do | Gia toc
#   1   |  12   |  -90 .. 90    |  80    |  120
#   2   |  243  |    0 .. 90    |   2    |    2
#   3   |  126  |  -90 .. 90    |   8    |   10
#   4   |   1   |    0 .. 90    |  80    |  200

stm32_emulator:
  ros__parameters:
    link_path: /tmp/ttySTM32       # cong noi tiep ao, node cau noi mo cong nay

    ratio:   [12, 243, 126, 1]
    dir:     [1, 1, 1, 1]
    min_deg: [-90.0, 0.0, -90.0, 0.0]
    max_deg: [90.0, 90.0, 90.0, 90.0]
    dps:     [80.0, 2.0, 8.0, 80.0]       # do/s tai khop
    acc:     [120.0, 2.0, 10.0, 200.0]    # do/s^2 tai khop

    stream_acc_gain: 4.0           # JOINT_STREAM_ACC_GAIN trong joint.c
    cycle_ms: 20                   # ROS_CYCLE_MS trong ros_link.c
    watchdog_ms: 200               # ROS_WATCHDOG_MS
    ros_mode_timeout_ms: 1000      # ROS_MODE_TIMEOUT_MS
    homed: true                    # gia dinh da home bang cam bien truoc khi chay

    servo_speed_us_s: 3900.0       # MG996R ~0.17 s / 60 do
    servo_start_us: 1300           # kep dang dong luc bat dau

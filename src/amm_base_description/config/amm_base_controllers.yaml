# ros2_control cho xe AMM (che do drive_mode:=control)
# File nay duoc plugin gz_ros2_control doc (khai bao trong amm_base_gazebo.xacro).

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController


mecanum_drive_controller:
  ros__parameters:
    # Khong nhan lenh moi trong 0.5 s thi controller tu dung xe
    reference_timeout: 0.5

    front_left_wheel_command_joint_name: front_left_wheel_joint
    front_right_wheel_command_joint_name: front_right_wheel_joint
    rear_right_wheel_command_joint_name: rear_right_wheel_joint
    rear_left_wheel_command_joint_name: rear_left_wheel_joint

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      # Phai trung voi wheel_radius trong amm_base.urdf.xacro
      wheels_radius: 0.040    # banh 80 mm tam thoi. Banh 75 mm: 0.0372
      # l_x + l_y = wheel_x + wheel_y = 0.085 + 0.146 = 0.231 (so thiet ke)
      #
      # THI NGHIEM "truot khi xoay": dat nho hon so that 6 %.
      # Xe that: khi xoay, con lan truot nen than xe quay IT hon muc banh "bao".
      # Dat 0.218 thi odometry bao goc xoay NHIEU hon goc that khoang 6 %,
      # giong hien tuong do. Con quay IMU khong bi anh huong.
      # Tro ve so thiet ke: 0.231
      sum_of_robot_center_projection_on_X_Y_axis: 0.231

    # base_footprint (khong phai base_link) vi robot_state_publisher da phat
    # base_footprint → base_link. Neu de base_link, base_link se co 2 cha.
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

# joint_limits.yaml cho MoveIt 2 (ROS 2 Jazzy)
# Ghi de / bo sung gioi han dong hoc lay tu URDF.
# Jazzy: moi gia tri so phai la so thuc (10.0, khong phai 10).
# Jazzy: bo tao thoi gian quy dao (TOTG) bat buoc moi khop co gioi han gia toc.
#
# KHONG DUOC VUOT toc do / gia toc firmware (bang joint.c), neu khong khop chay cham hon quy dao,
# controller bao lech va huy. Gia tri duoi day = dung bang joint.c ngay 2026-10-26:
#   J1 80 do/s 120 do/s2 | J2 8 do/s 10 do/s2 | J3 25 do/s 35 do/s2 | J4 80 do/s 200 do/s2
# Sua joint.c thi sua theo o day.

default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

joint_limits:

  # ----- Tay may 4 bac -----
  JOINT_1:
    has_velocity_limits: true
    max_velocity: 1.396
    has_acceleration_limits: true
    max_acceleration: 2.094
  JOINT_2:
    has_velocity_limits: true
    max_velocity: 0.139
    has_acceleration_limits: true
    max_acceleration: 0.174
  JOINT_3:
    has_velocity_limits: true
    max_velocity: 0.436
    has_acceleration_limits: true
    max_acceleration: 0.61
  JOINT_4:
    has_velocity_limits: true
    max_velocity: 1.396
    has_acceleration_limits: true
    max_acceleration: 3.49

  # ----- Kep -----
  GRIPPER_JOINT:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0

  # Khop mimic chay theo GRIPPER_JOINT, khai bao cung gioi han de khong thieu
  R_FINGER_JOINT:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  R_BAR_JOINT:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  L_CRANK_JOINT:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  L_FINGER_JOINT:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  L_BAR_JOINT:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0

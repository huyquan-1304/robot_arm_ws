# Bo giai dong hoc nguoc (IK) cho MoveIt 2
# Chi nhom "arm" can IK. Nhom "gripper" la cay co nhanh (2 ngon), khong phai chuoi,
# nen KDL khong giai duoc. Nhom "home_robot" chi dung tu the dat ten.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
